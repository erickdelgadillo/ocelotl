---
- name: Validate Ollama profile
  ansible.builtin.assert:
    that:
      - ollama_profile in ['auto', 'cpu', 'laptop', 'workstation']
    fail_msg: "Choose auto, cpu, laptop or workstation."

- name: Read NVIDIA GPU memory if available
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-gpu=memory.total
      - --format=csv,noheader,nounits
  register: ollama_gpu_memory
  changed_when: false
  failed_when: false
  when: ollama_profile == 'auto' and (ollama_model | length == 0)

- name: Resolve GPU memory
  ansible.builtin.set_fact:
    ollama_gpu_vram_mb: >-
      {{ (ollama_gpu_memory.stdout_lines | default([])
      | first | default('0') | trim) | int }}
  when: ollama_profile == 'auto' and (ollama_model | length == 0)

- name: Resolve Ollama model profile
  ansible.builtin.set_fact:
    ollama_effective_profile: >-
      {{ ('workstation' if (ollama_gpu_vram_mb | int >= 12000)
      else 'laptop' if (ollama_gpu_vram_mb | int >= 6000)
      else 'cpu') if ollama_profile == 'auto' else ollama_profile }}
  when: ollama_model | length == 0

- name: Select Ollama model
  ansible.builtin.set_fact:
    ollama_selected_model: >-
      {{ ollama_model if ollama_model | length > 0
      else ollama_models[ollama_effective_profile] }}

- name: Check for existing Ollama executable
  ansible.builtin.command:
    argv:
      - which
      - ollama
  register: ollama_executable
  changed_when: false
  failed_when: false

- name: Check whether Ollama system user exists
  ansible.builtin.command:
    argv:
      - id
      - -u
      - ollama
  register: ollama_system_user
  changed_when: false
  failed_when: false

- name: Check whether Ollama systemd unit exists
  ansible.builtin.command:
    argv:
      - systemctl
      - cat
      - ollama.service
  register: ollama_systemd_unit
  changed_when: false
  failed_when: false

- name: Determine whether Ollama installation needs repair
  ansible.builtin.set_fact:
    ollama_needs_install: >-
      {{ ollama_executable.rc != 0
      or ollama_system_user.rc != 0
      or ollama_systemd_unit.rc != 0 }}

- name: Download official Ollama Linux installer when needed
  ansible.builtin.get_url:
    url: "{{ ollama_install_script_url }}"
    dest: /tmp/ocelotl-ollama-install.sh
    mode: '0700'
    force: true
    timeout: 60
  register: ollama_installer_download
  until: ollama_installer_download is succeeded
  retries: 3
  delay: 5
  when: ollama_needs_install | bool

- name: Install or repair Ollama using official Linux installer
  ansible.builtin.command:
    argv:
      - /bin/sh
      - /tmp/ocelotl-ollama-install.sh
  become: true
  register: ollama_install_result
  until: ollama_install_result.rc == 0
  retries: 3
  delay: 10
  when: ollama_needs_install | bool
  changed_when: true

- name: Verify Ollama system user after installation
  ansible.builtin.command:
    argv:
      - id
      - -u
      - ollama
  changed_when: false

- name: Verify Ollama systemd unit after installation
  ansible.builtin.command:
    argv:
      - systemctl
      - cat
      - ollama.service
  changed_when: false

- name: Ensure Ollama service is running
  ansible.builtin.systemd_service:
    name: ollama
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: Check whether selected model is already downloaded
  ansible.builtin.command:
    argv:
      - ollama
      - show
      - "{{ ollama_selected_model }}"
  register: ollama_existing_model
  changed_when: false
  failed_when: false
  when: ollama_pull_model | bool

- name: Download selected local model
  ansible.builtin.command:
    argv:
      - ollama
      - pull
      - "{{ ollama_selected_model }}"
  when:
    - ollama_pull_model | bool
    - ollama_existing_model.rc != 0
  changed_when: true

- name: Verify selected local model
  ansible.builtin.command:
    argv:
      - ollama
      - show
      - "{{ ollama_selected_model }}"
  changed_when: false
  when: ollama_pull_model | bool
