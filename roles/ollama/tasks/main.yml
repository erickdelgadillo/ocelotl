---
- name: Validate Ollama profile
  ansible.builtin.assert:
    that:
      - ollama_profile in ['auto', 'cpu', 'laptop', 'workstation']
    fail_msg: "Choose auto, cpu, laptop or workstation."

- name: Read NVIDIA GPU memory if available
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-gpu=memory.total
      - --format=csv,noheader,nounits
  register: ollama_gpu_memory
  changed_when: false
  failed_when: false
  when: ollama_profile == 'auto' and (ollama_model | length == 0)

- name: Resolve GPU memory
  ansible.builtin.set_fact:
    ollama_gpu_vram_mb: >-
      {{ (ollama_gpu_memory.stdout_lines | default([])
      | first | default('0') | trim) | int }}
  when: ollama_profile == 'auto' and (ollama_model | length == 0)

- name: Resolve Ollama model profile
  ansible.builtin.set_fact:
    ollama_effective_profile: >-
      {{ ('workstation' if (ollama_gpu_vram_mb | int >= 12000)
      else 'laptop' if (ollama_gpu_vram_mb | int >= 6000)
      else 'cpu') if ollama_profile == 'auto' else ollama_profile }}
  when: ollama_model | length == 0

- name: Select Ollama model
  ansible.builtin.set_fact:
    ollama_selected_model: >-
      {{ ollama_model if ollama_model | length > 0
      else ollama_models[ollama_effective_profile] }}

- name: Check for existing Ollama executable
  ansible.builtin.command:
    argv:
      - which
      - ollama
  register: ollama_executable
  changed_when: false
  failed_when: false

- name: Download official Ollama Linux installer
  ansible.builtin.get_url:
    url: "{{ ollama_install_script_url }}"
    dest: /tmp/ocelotl-ollama-install.sh
    mode: '0700'
  when: ollama_executable.rc != 0

- name: Install Ollama using official Linux installer
  ansible.builtin.command:
    argv:
      - /bin/sh
      - /tmp/ocelotl-ollama-install.sh
  become: true
  when: ollama_executable.rc != 0
  changed_when: true

- name: Ensure Ollama service is running
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started
  become: true

- name: Check whether selected model is already downloaded
  ansible.builtin.command:
    argv:
      - ollama
      - show
      - "{{ ollama_selected_model }}"
  register: ollama_existing_model
  changed_when: false
  failed_when: false
  when: ollama_pull_model | bool

- name: Download selected local model
  ansible.builtin.command:
    argv:
      - ollama
      - pull
      - "{{ ollama_selected_model }}"
  when:
    - ollama_pull_model | bool
    - ollama_existing_model.rc != 0
  changed_when: true

- name: Verify selected local model
  ansible.builtin.command:
    argv:
      - ollama
      - show
      - "{{ ollama_selected_model }}"
  changed_when: false
  when: ollama_pull_model | bool
