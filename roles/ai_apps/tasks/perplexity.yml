---
- name: Create Perplexity desktop launcher
  ansible.builtin.copy:
    dest: "{{ ai_apps_launcher_directory }}/ocelotl-perplexity.desktop"
    mode: '0644'
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Perplexity (Web)
      Comment=Official Perplexity web application
      Exec={{ ai_apps_browser_command }} https://www.perplexity.ai/
      Icon=web-browser
      Terminal=false
      Categories=Network;Utility;
