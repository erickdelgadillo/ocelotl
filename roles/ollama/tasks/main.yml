---
- name: Validate Ollama hardware profile
  ansible.builtin.assert:
    that:
      - ollama_profile in ollama_models
    fail_msg: "Select ollama_profile=laptop or ollama_profile=workstation."

- name: Resolve local model selection
  ansible.builtin.set_fact:
    ollama_selected_model: >-
      {{ ollama_model if (ollama_model | length > 0)
         else ollama_models[ollama_profile] }}

- name: Check for existing Ollama executable
  ansible.builtin.command: which ollama
  register: ollama_executable
  changed_when: false
  failed_when: false

- name: Download official Ollama Linux installer
  ansible.builtin.get_url:
    url: "{{ ollama_install_script_url }}"
    dest: /tmp/ocelotl-ollama-install.sh
    mode: "0700"
  when: ollama_executable.rc != 0

- name: Install Ollama using official Linux installer
  ansible.builtin.command: /bin/sh /tmp/ocelotl-ollama-install.sh
  become: true
  when: ollama_executable.rc != 0
  changed_when: true

- name: Ensure Ollama service is running
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started
  become: true

- name: Check whether selected model is already downloaded
  ansible.builtin.command:
    argv:
      - ollama
      - show
      - "{{ ollama_selected_model }}"
  register: ollama_existing_model
  changed_when: false
  failed_when: false

- name: Download selected local model
  ansible.builtin.command:
    argv:
      - ollama
      - pull
      - "{{ ollama_selected_model }}"
  when: ollama_existing_model.rc != 0
  changed_when: true

- name: Verify selected local model
  ansible.builtin.command:
    argv:
      - ollama
      - show
      - "{{ ollama_selected_model }}"
  changed_when: false
