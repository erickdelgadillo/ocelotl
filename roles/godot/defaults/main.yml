---
godot_version: "4.7.2"
godot_archive_name: "Godot_v{{ godot_version }}-stable_linux.x86_64.zip"

godot_download_url: >-
  https://github.com/godotengine/godot-builds/releases/download/{{ godot_version }}-stable/{{ godot_archive_name }}

godot_install_dir: "/opt/godot"
godot_binary_path: "{{ godot_install_dir }}/Godot_v{{ godot_version }}-stable_linux.x86_64"
godot_symlink_path: "/usr/local/bin/godot"
godot_desktop_file: "/usr/share/applications/godot.desktop"
godot_icon_path: "/usr/share/icons/hicolor/scalable/apps/godot.svg"
godot_icon_url: "https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/misc/logo/icon.svg"