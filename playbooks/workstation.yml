---
- name: Configure Ocelotl workstation
  hosts: workstation

  roles:
    - apt

    - role: common
      tags:
        - common

    - ansible
    - r
    - conda
    - java
    - docker
    - nextflow
    - vscode
    - shell

    - role: security_tools
      tags:
        - security

    - obsidian
    - godot

    - role: libresprite
      tags:
        - libresprite

    # Full installs AI only with OCELOTL_ENABLE_AI=1.
    # The model pull is a separate opt-in (OCELOTL_PULL_MODEL=1).
    - role: ollama
      vars:
        ollama_pull_model: >-
          {{ (lookup('env', 'OCELOTL_PULL_MODEL') | bool)
          or ('ollama' in ansible_run_tags) }}
      when: >-
        (lookup('env', 'OCELOTL_ENABLE_AI') | bool)
        or ('ollama' in ansible_run_tags)
      tags:
        - ollama

    - role: ai_apps
      when: lookup('env', 'OCELOTL_ENABLE_AI') | bool
      tags:
        - ai_apps
