---
- name: Configure Ocelotl workstation
  hosts: workstation

  roles:
    - apt

    - role: common
      tags:
        - common

    - ansible
    - r
    - conda
    - java
    - docker
    - nextflow
    - vscode
    - shell
    - obsidian
    - godot

    - role: libresprite
      tags:
        - libresprite

    # Opt-in only: run with --tags ollama and choose ollama_profile.
    - role: ollama
      tags:
        - never
        - ollama
