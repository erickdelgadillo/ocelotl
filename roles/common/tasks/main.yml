---
- name: Install common system packages
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - gnupg
      - htop
      - jq
      - rsync
      - software-properties-common
      - tree
      - unzip
      - wget
      - zip
    state: present
