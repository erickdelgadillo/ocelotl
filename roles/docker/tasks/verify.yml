---
- name: Read Docker group membership
  ansible.builtin.getent:
    database: group
    key: "{{ docker_group }}"

- name: Verify user belongs to Docker group
  ansible.builtin.assert:
    that:
      - ansible_user_id in ansible_facts.getent_group[docker_group][2]
    fail_msg: >-
      User {{ ansible_user_id }} is not a member of the Docker group.
    success_msg: >-
      User {{ ansible_user_id }} belongs to the Docker group.

- name: Read Docker version
  ansible.builtin.command:
    argv:
      - docker
      - --version
  register: docker_version_result
  changed_when: false
  check_mode: false

- name: Verify Docker CLI
  ansible.builtin.assert:
    that:
      - docker_version_result.rc == 0
      - "'Docker version' in docker_version_result.stdout"
    fail_msg: >-
      Docker CLI is not available.
    success_msg: >-
      Docker CLI is installed correctly.

- name: Read Docker Compose version
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: docker_compose_version_result
  changed_when: false
  check_mode: false

- name: Verify Docker Compose
  ansible.builtin.assert:
    that:
      - docker_compose_version_result.rc == 0
      - "'Docker Compose version' in docker_compose_version_result.stdout"
    fail_msg: >-
      Docker Compose is not available.
    success_msg: >-
      Docker Compose is installed correctly.

- name: Read Docker daemon information
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{{ '{{json .ServerVersion}}' }}"
  register: docker_daemon_result
  changed_when: false
  check_mode: false

- name: Verify Docker daemon
  ansible.builtin.assert:
    that:
      - docker_daemon_result.rc == 0
      - docker_daemon_result.stdout | length > 0
    fail_msg: >-
      Docker daemon is not responding.
    success_msg: >-
      Docker daemon is running correctly.